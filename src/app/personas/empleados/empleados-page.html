<app-empleados-filtros (cambiar)="store.buscar($event)" />

<section class="mt-6 card bg-base-200 border border-base-300 shadow-xl">
  <div class="card-body">
    <app-encabezado-listado titulo="Lista de empleados" descripcion="Administra conductores y monitoras: contrato, sueldo y licencia de conducción."
      [cargando]="store.cargando()" [total]="store.total()" [modoLocal]="store.modoLocal" [error]="store.error()"
      textoNuevo="Nuevo empleado" (nuevo)="nuevo()" (reintentar)="store.recargar()" />

    <app-empleados-tabla
      [empleados]="store.items()"
      [cargando]="store.cargando()"
      [hayFiltros]="store.hayFiltros()"
      (consultar)="abrir('consultar', $event)"
      (editar)="abrir('editar', $event)"
      (eliminar)="pedirEliminar($event)"
      (crear)="nuevo()" />

    <app-paginacion
      [pagina]="store.paginacion().pagina"
      [tamano]="store.paginacion().tamano"
      [total]="store.total()"
      [totalPaginas]="store.totalPaginas()"
      (cambiarPagina)="store.irAPagina($event)"
      (cambiarTamano)="store.cambiarTamano($event)" />
  </div>
</section>

<!-- Crear / editar / consultar -->
<app-modal [(abierto)]="modalAbierto" [titulo]="tituloModal()" [subtitulo]="subtituloModal()" ancho="max-w-4xl">
  @if (modalAbierto()) {
    <div class="relative">
      @if (cargandoDetalle()) {
        <div class="absolute inset-0 z-10 grid place-items-center bg-base-200/80 rounded-xl">
          <span class="loading loading-spinner loading-lg text-primary"></span>
        </div>
      }
      <app-empleado-formulario idFormulario="form-empleado" [modo]="modo()" [empleado]="seleccionado()"
        (guardar)="guardar($event)" />
    </div>
  }
  <!-- Un @if por zona: cada bloque debe tener un único elemento raíz para proyectarse al pie -->
  @if (modalAbierto()) {
    <app-acciones-formulario pie formulario="form-empleado" [modo]="modo()" [guardando]="store.guardando()"
      [bloqueado]="cargandoDetalle()" textoCrear="Registrar empleado" (cancelar)="modalAbierto.set(false)"
      (editar)="modo.set('editar')" />
  }
</app-modal>

<app-dialogo-confirmacion
  [(abierto)]="confirmacionAbierta"
  titulo="Eliminar empleado"
  [mensaje]="mensajeEliminar()"
  [permitirConfirmar]="puedeEliminar()"
  [procesando]="store.guardando() || verificandoEliminar()"
  (confirmar)="confirmarEliminar()" />
