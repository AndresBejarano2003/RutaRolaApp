<app-acudientes-filtros (cambiar)="store.buscar($event)" />

<section class="mt-6 card bg-base-200 border border-base-300 shadow-xl">
  <div class="card-body">
    <app-encabezado-listado titulo="Lista de acudientes" descripcion="Administra los acudientes y los estudiantes que tienen a cargo."
      [cargando]="store.cargando()" [total]="store.total()" [modoLocal]="store.modoLocal" [error]="store.error()"
      textoNuevo="Nuevo acudiente" (nuevo)="nuevo()" (reintentar)="store.recargar()" />

    <app-acudientes-tabla
      [acudientes]="store.items()"
      [cargando]="store.cargando()"
      [hayFiltros]="store.hayFiltros()"
      (consultar)="abrir('consultar', $event)"
      (editar)="abrir('editar', $event)"
      (eliminar)="pedirEliminar($event)"
      (verEstudiantes)="verEstudiantes($event)"
      (crear)="nuevo()" />

    <app-paginacion
      [pagina]="store.paginacion().pagina"
      [tamano]="store.paginacion().tamano"
      [total]="store.total()"
      [totalPaginas]="store.totalPaginas()"
      (cambiarPagina)="store.irAPagina($event)"
      (cambiarTamano)="store.cambiarTamano($event)" />
  </div>
</section>

<!-- Crear / editar / consultar -->
<app-modal [(abierto)]="modalAbierto" [titulo]="tituloModal()" [subtitulo]="subtituloModal()" ancho="max-w-4xl">
  @if (modalAbierto()) {
    <div class="relative">
      @if (cargandoDetalle()) {
        <div class="absolute inset-0 z-10 grid place-items-center bg-base-200/80 rounded-xl">
          <span class="loading loading-spinner loading-lg text-primary"></span>
        </div>
      }
      <app-acudiente-formulario idFormulario="form-acudiente" [modo]="modo()" [acudiente]="seleccionado()"
        (guardar)="guardar($event)" />

      @if (modo() !== 'crear' && seleccionado(); as acudiente) {
        <h4 class="text-sm font-semibold uppercase tracking-wide text-info mt-6 mb-3 border-b border-base-300 pb-1">
          Estudiantes a cargo
        </h4>
        <app-estudiantes-a-cargo [acudienteId]="acudiente.id" />
      }
    </div>
  }
  <!-- Un @if por zona: cada bloque debe tener un único elemento raíz para proyectarse al pie -->
  @if (modalAbierto()) {
    <app-acciones-formulario pie formulario="form-acudiente" [modo]="modo()" [guardando]="store.guardando()"
      [bloqueado]="cargandoDetalle()" textoCrear="Registrar acudiente" (cancelar)="modalAbierto.set(false)"
      (editar)="modo.set('editar')" />
  }
</app-modal>

<!-- Estudiantes a cargo -->
<app-modal [(abierto)]="estudiantesAbierto" titulo="Estudiantes a cargo" [subtitulo]="nombreAcudienteEstudiantes()">
  @if (estudiantesAbierto() && acudienteEstudiantes(); as acudiente) {
    <app-estudiantes-a-cargo [acudienteId]="acudiente.id" />
  }
  @if (estudiantesAbierto()) {
    <div pie class="flex justify-end">
      <button type="button" class="btn btn-ghost" (click)="estudiantesAbierto.set(false)">Cerrar</button>
    </div>
  }
</app-modal>

<app-dialogo-confirmacion
  [(abierto)]="confirmacionAbierta"
  titulo="Eliminar acudiente"
  [mensaje]="mensajeEliminar()"
  [permitirConfirmar]="puedeEliminar()"
  [procesando]="store.guardando() || verificandoEliminar()"
  (confirmar)="confirmarEliminar()" />
