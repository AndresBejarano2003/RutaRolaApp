<div class="min-h-dvh flex flex-col bg-base-100 text-base-content">
  <header class="sticky top-0 z-30 bg-base-200/95 backdrop-blur border-b border-base-300 pt-[env(safe-area-inset-top)]">
    <div class="w-full max-w-5xl mx-auto px-4 h-16 flex items-center gap-3">
      <a routerLink="/portal" class="shrink-0" aria-label="Ir al inicio del portal">
        <img src="logos/logo-oficial-sin-fondo-lb.png" alt="RutaRola" class="h-9 w-auto" />
      </a>
      <div class="min-w-0 flex-1 border-l border-base-300 pl-3">
        <p class="font-semibold leading-tight truncate">{{ sesion()?.nombre }}</p>
        <p class="text-xs text-base-content/70 flex items-center gap-1.5">
          <i class="fa-solid fa-people-roof text-info" aria-hidden="true"></i> Portal del acudiente
        </p>
      </div>
      <button type="button" class="btn btn-ghost btn-sm btn-square" [disabled]="estado.cargando()" (click)="estado.cargar()"
        aria-label="Actualizar datos">
        <i class="fa-solid fa-rotate" [class.fa-spin]="estado.cargando()" aria-hidden="true"></i>
      </button>
      <a routerLink="/portal/cuenta" class="btn btn-ghost btn-sm btn-square" aria-label="Mi cuenta">
        <i class="fa-solid fa-user-gear" aria-hidden="true"></i>
      </a>
      <button type="button" class="btn btn-ghost btn-sm text-error" (click)="salir()" aria-label="Cerrar sesión">
        <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
        <span class="hidden sm:inline">Salir</span>
      </button>
    </div>
    <!-- Pestañas (≥ sm) -->
    <nav class="hidden sm:block border-t border-base-300" aria-label="Secciones del portal">
      <ul class="w-full max-w-5xl mx-auto px-4 flex gap-1">
        @for (s of secciones; track s.ruta) {
          <li>
            <a [routerLink]="s.ruta" routerLinkActive="border-primary text-base-content" [routerLinkActiveOptions]="{ exact: s.exacta }"
              ariaCurrentWhenActive="page"
              class="flex items-center gap-2 px-3 py-3 border-b-2 border-transparent text-base-content/70 hover:text-base-content text-sm font-medium">
              <i [class]="s.icono" aria-hidden="true"></i> {{ s.texto }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </header>
  <app-notificaciones />

  <main class="flex-1 w-full max-w-5xl mx-auto px-3 sm:px-4 py-4 sm:py-6 pb-[calc(5rem+env(safe-area-inset-bottom))] sm:pb-8">
    @if (estado.error(); as error) {
      <div role="alert" class="alert alert-error alert-soft mb-4">
        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
        <span>{{ error }}</span>
        <button type="button" class="btn btn-sm" (click)="estado.cargar()">Reintentar</button>
      </div>
    }
    <router-outlet />
  </main>

  <!-- Barra inferior (celular) -->
  <nav class="sm:hidden fixed bottom-0 inset-x-0 z-30 bg-base-200 border-t border-base-300 pb-[env(safe-area-inset-bottom)]"
    aria-label="Secciones del portal">
    <ul class="grid grid-cols-4">
      @for (s of secciones; track s.ruta) {
        <li>
          <a [routerLink]="s.ruta" routerLinkActive="text-primary" [routerLinkActiveOptions]="{ exact: s.exacta }" ariaCurrentWhenActive="page"
            class="flex flex-col items-center gap-1 py-2 text-xs text-base-content/70">
            <i [class]="s.icono + ' text-lg'" aria-hidden="true"></i> {{ s.texto }}
          </a>
        </li>
      }
    </ul>
  </nav>
</div>
