<!-- navbar -->
<app-barra-superior />

<!-- CONTENEDOR PRINCIPAL -->
<div class="drawer lg:drawer-open">
    <!-- Toggle -->
    <input id="drawer-toggle" type="checkbox" class="drawer-toggle" />
    <!-- CONTENIDO -->
    <div class="drawer-content flex flex-col bg-gray-900 text-white h-screen overflow-hidden">
        <!-- BOTÓN MOBILE -->
        <label for="drawer-toggle"
            class="btn bg-gray-800 text-white hover:bg-gray-700 lg:hidden fixed bottom-6 right-6 z-50 shadow-lg rounded-full">
            <i class="fa-solid fa-bars text-lg"></i>
        </label>

        <div class="p-4 pb-28 w-full flex-1 overflow-y-auto">
            <router-outlet />

        </div>
    </div>
    <!-- SIDEBAR -->
    <div class="drawer-side">
        <label for="drawer-toggle" class="drawer-overlay"></label>
        <app-menu-lateral />
    </div>
</div>

<dialog id="modalNotificaciones" class="modal">

    <div class="modal-box max-w-3xl bg-gray-800 border border-gray-700">

        <!-- HEADER -->
        <div class="flex justify-between items-center mb-6">

            <h3 class="text-2xl font-bold text-white">

                <i class="fa-solid fa-bell text-yellow-400 mr-2"></i>
                Centro de notificaciones

            </h3>

            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost">
                    ✕
                </button>
            </form>

        </div>

        <!-- LISTADO -->
        <div class="space-y-3 max-h-[500px] overflow-y-auto">

            <!-- ITEM -->
            <div
                class="flex justify-between items-center p-4 rounded-xl bg-gray-900 border border-gray-700 hover:border-blue-500 transition">

                <div class="flex gap-4 items-start">

                    <div class="w-12 h-12 rounded-full bg-blue-500/20 flex items-center justify-center">

                        <i class="fa-solid fa-bus text-blue-400"></i>

                    </div>

                    <div>

                        <p class="text-white font-medium">

                            Vehículo BUS-07 registrado

                        </p>

                        <p class="text-xs text-gray-400">

                            Hace 10 minutos

                        </p>

                    </div>

                </div>

                <button class="btn btn-sm btn-circle btn-error btn-outline">

                    <i class="fa-solid fa-trash"></i>

                </button>

            </div>

            <!-- ITEM -->
            <div class="flex justify-between items-center p-4 rounded-xl bg-gray-900 border border-gray-700">

                <div class="flex gap-4 items-start">

                    <div class="w-12 h-12 rounded-full bg-green-500/20 flex items-center justify-center">

                        <i class="fa-solid fa-file-invoice text-green-400"></i>

                    </div>

                    <div>

                        <p class="text-white font-medium">

                            Factura #1523 enviada

                        </p>

                        <p class="text-xs text-gray-400">

                            Hace 20 minutos

                        </p>

                    </div>

                </div>

                <button class="btn btn-sm btn-circle btn-error btn-outline">

                    <i class="fa-solid fa-trash"></i>

                </button>

            </div>

        </div>

        <!-- FOOTER -->
        <div class="modal-action">

            <form method="dialog">

                <button class="btn bg-yellow-400 hover:bg-yellow-300 text-black border-none">
                    Cerrar
                </button>

            </form>

            <button class="btn btn-error">

                <i class="fa-solid fa-trash-can mr-2"></i>
                Eliminar todas

            </button>

        </div>

    </div>

</dialog>
