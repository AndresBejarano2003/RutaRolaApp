<!--
  Layout responsive:
  - Altura 100dvh (correcta en iPhone/Android con barras del navegador).
  - < lg: el menú es un panel deslizable que se abre con el botón ☰ de la barra superior.
  - ≥ lg: menú fijo a la izquierda.
  - El contenido tiene `min-w-0`: las tablas anchas hacen scroll dentro de su tarjeta, no la página.
  - En pantallas extra grandes el contenido se limita a 1920px y se centra.
-->
<div class="h-dvh flex flex-col bg-base-100 text-base-content">
  <app-barra-superior class="shrink-0" />
  <app-notificaciones />

  <div class="drawer lg:drawer-open flex-1 min-h-0">
    <input id="drawer-toggle" type="checkbox" class="drawer-toggle" aria-label="Abrir menú" />
    <div class="drawer-content flex flex-col min-w-0 min-h-0">
      <main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden">
        <div class="w-full max-w-[1920px] mx-auto px-3 py-4 sm:px-4 lg:px-6 lg:py-6 2xl:px-8 pb-[max(1.5rem,env(safe-area-inset-bottom))]">
          <router-outlet />
        </div>
      </main>
    </div>
    <div class="drawer-side z-40 lg:h-full">
      <label for="drawer-toggle" class="drawer-overlay" aria-label="Cerrar menú"></label>
      <app-menu-lateral />
    </div>
  </div>
</div>

<dialog id="modalNotificaciones" class="modal modal-bottom sm:modal-middle">
  <div class="modal-box w-full max-w-3xl bg-base-200 border border-base-300 p-0 flex flex-col max-h-[calc(100dvh-2rem)]">
    <header class="shrink-0 flex justify-between items-center gap-3 px-4 sm:px-6 pt-5 pb-4 border-b border-base-300">
      <h3 class="text-xl sm:text-2xl font-bold">
        <i class="fa-solid fa-bell text-primary mr-2"></i>Centro de notificaciones
      </h3>
      <form method="dialog">
        <button class="btn btn-sm btn-circle btn-ghost" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
      </form>
    </header>

    <div class="flex-1 min-h-0 overflow-y-auto px-4 sm:px-6 py-4 space-y-3">
      <div class="flex justify-between items-center gap-3 p-3 sm:p-4 rounded-xl bg-base-100 border border-base-300">
        <div class="flex gap-3 sm:gap-4 items-start min-w-0">
          <div class="shrink-0 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-secondary/20 grid place-items-center">
            <i class="fa-solid fa-bus text-info"></i>
          </div>
          <div class="min-w-0">
            <p class="font-medium">Vehículo BUS-07 registrado</p>
            <p class="text-xs text-base-content/70">Hace 10 minutos</p>
          </div>
        </div>
        <button class="btn btn-sm btn-circle btn-ghost text-error shrink-0" aria-label="Eliminar notificación">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>

      <div class="flex justify-between items-center gap-3 p-3 sm:p-4 rounded-xl bg-base-100 border border-base-300">
        <div class="flex gap-3 sm:gap-4 items-start min-w-0">
          <div class="shrink-0 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-success/20 grid place-items-center">
            <i class="fa-solid fa-file-invoice text-success"></i>
          </div>
          <div class="min-w-0">
            <p class="font-medium">Factura #1523 enviada</p>
            <p class="text-xs text-base-content/70">Hace 20 minutos</p>
          </div>
        </div>
        <button class="btn btn-sm btn-circle btn-ghost text-error shrink-0" aria-label="Eliminar notificación">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>
    </div>

    <footer class="shrink-0 flex flex-col-reverse sm:flex-row sm:justify-end gap-2 px-4 sm:px-6 py-4 border-t border-base-300">
      <button class="btn bg-base-300 border-neutral hover:bg-neutral text-error">
        <i class="fa-solid fa-trash-can"></i> Eliminar todas
      </button>
      <form method="dialog" class="contents">
        <button class="btn btn-primary">Cerrar</button>
      </form>
    </footer>
  </div>
  <form method="dialog" class="modal-backdrop"><button aria-label="Cerrar">cerrar</button></form>
</dialog>
