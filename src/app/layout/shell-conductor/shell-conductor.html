<div class="min-h-dvh flex flex-col bg-base-100 text-base-content">
  <header class="sticky top-0 z-30 bg-base-200/95 backdrop-blur border-b border-base-300 pt-[env(safe-area-inset-top)]">
    <div class="w-full max-w-3xl mx-auto px-4 h-16 flex items-center gap-3">
      <a routerLink="/ruta-del-dia" class="shrink-0" aria-label="Ir a mis rutas">
        <img src="logos/logo-oficial-sin-fondo-lb.png" alt="RutaRola" class="h-9 w-auto" />
      </a>
      <div class="min-w-0 flex-1 border-l border-base-300 pl-3">
        <p class="font-semibold leading-tight truncate">{{ sesion()?.nombre }}</p>
        <p class="text-xs text-base-content/70 flex items-center gap-1.5">
          <i class="fa-solid fa-id-badge text-info" aria-hidden="true"></i>
          {{ rol() }}
        </p>
      </div>
      <button type="button" class="btn btn-ghost btn-sm text-error" (click)="salir()" aria-label="Cerrar sesión">
        <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
        <span class="hidden sm:inline">Salir</span>
      </button>
    </div>
  </header>
  <app-notificaciones />

  <main class="flex-1 w-full max-w-3xl mx-auto px-3 sm:px-4 py-4 sm:py-6 pb-[max(1.5rem,env(safe-area-inset-bottom))]">
    <router-outlet />
  </main>
</div>
