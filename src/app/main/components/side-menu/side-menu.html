<!-- navbar -->
<main-side-menu-header />

<!-- CONTENEDOR PRINCIPAL -->
<div class="drawer lg:drawer-open">
  <!-- Toggle -->
  <input id="drawer-toggle" type="checkbox" class="drawer-toggle" />
  <!-- CONTENIDO -->
  <div class="drawer-content flex flex-col bg-gray-900 text-white">
    <!-- BOTÓN MOBILE -->
    <label for="drawer-toggle"
      class="btn bg-gray-800 text-white hover:bg-gray-700 lg:hidden fixed bottom-6 right-6 z-50 shadow-lg rounded-full">
      <i class="fa-solid fa-bars text-lg"></i>
    </label>

    <div class="p-4 w-full h-full">

      @if (!hasContent) {
      <!-- LOADING -->
      <div class="space-y-6 animate-[pulse_1.5s_ease-in-out_infinite]">

        <!-- HEADER -->
        <div class="space-y-3">
          <div class="skeleton bg-gray-800 before:bg-gray-700/40 h-6 w-1/4"></div>
          <div class="skeleton bg-gray-800 before:bg-gray-700/40 h-4 w-1/2"></div>
          <div class="skeleton bg-gray-800 before:bg-gray-700/40 h-4 w-2/3"></div>
        </div>

        <!-- CARD PRINCIPAL -->
        <div
          class="skeleton bg-gray-800 before:bg-gray-700/40 w-full h-64 rounded-2xl flex items-center justify-center">
          <i class="fa-regular fa-image text-4xl text-gray-500"></i>
        </div>

        <!-- CONTENIDO -->
        <div class="space-y-3">
          <div class="skeleton bg-gray-800 before:bg-gray-700/40 h-4 w-full"></div>
          <div class="skeleton bg-gray-800 before:bg-gray-700/40 h-4 w-5/6"></div>
          <div class="skeleton bg-gray-800 before:bg-gray-700/40 h-4 w-4/6"></div>
          <div class="skeleton bg-gray-800 before:bg-gray-700/40 h-4 w-3/6"></div>
        </div>

        <!-- LISTADO -->
        <div class="space-y-3">
          <div class="skeleton bg-gray-800 before:bg-gray-700/40 h-4 w-full"></div>
          <div class="skeleton bg-gray-800 before:bg-gray-700/40 h-4 w-11/12"></div>
          <div class="skeleton bg-gray-800 before:bg-gray-700/40 h-4 w-10/12"></div>
          <div class="skeleton bg-gray-800 before:bg-gray-700/40 h-4 w-9/12"></div>
          <div class="skeleton bg-gray-800 before:bg-gray-700/40 h-4 w-8/12"></div>
        </div>

      </div>
      } @else {
      <router-outlet />
      }

    </div>
  </div>
  <!-- SIDEBAR -->
  <div class="drawer-side">
    <label for="drawer-toggle" class="drawer-overlay"></label>
    <main-side-menu-options />
  </div>
</div>
