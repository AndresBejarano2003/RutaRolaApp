<div class="h-[60px] flex flex-col flex-1 w-full ">
  <!-- <div class="navbar bg-gray-900 text-white border-b border-gray-700 px-4"> -->
  <div class="navbar bg-gray-900 text-white border-b border-gray-700 px-4 sticky top-0 z-50">
    <!-- IZQUIERDA -->
    <div class="flex-1">
      <div class="breadcrumbs text-sm mt-1">
        <ul>
          <!-- LOGO -->
          <li>
            <a>
              <img src="logos/logo-oficial-sin-fondo-lb.png" class="w-28" alt="RutaRola">
            </a>
          </li>
          @for(item of breadcrumbs; track item){
          <li>
            <span class="text-gray-200">
              {{ item }}
            </span>
          </li>
          }
        </ul>
      </div>
    </div>
    <!-- DERECHA -->
    <div class="flex-none flex items-center gap-2">
      <!-- NOTIFICACIONES -->
      <div class="dropdown dropdown-end">
        <label tabindex="0" class="btn btn-ghost btn-circle hover:bg-gray-800">
          <div class="indicator">
            <i class="fa-solid fa-bell text-gray-300"></i>
            <span class="badge badge-error badge-xs indicator-item">8</span>
          </div>
        </label>
        <div tabindex="0"
          class="mt-3 z-[1] card card-compact dropdown-content w-64 bg-gray-800 text-white shadow border border-gray-700">
          <div class="card-body">
            <span class="font-bold text-lg">Notificaciones</span>
            <span class="text-gray-400">Tienes 8 nuevas</span>
            <div class="card-actions mt-2">
              <button class="btn btn-sm btn-primary w-full" onclick="modalNotificaciones.showModal()">
                Ver todas
              </button>
            </div>
          </div>
        </div>
      </div>
      <!-- USUARIO -->
      <div class="dropdown dropdown-end">

        <!-- AVATAR -->
        <label tabindex="0"
          class="btn btn-ghost btn-circle avatar hover:bg-gray-800 transition-all duration-300 hover:scale-105">

          <div class="w-11 rounded-full border-2 border-blue-500 relative">

            <img [src]="userInfo.image" alt="Avatar usuario" />

            <!-- ONLINE / OFFLINE -->
            <div class="absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-gray-900"
              [class.bg-green-500]="userInfo.online" [class.bg-gray-500]="!userInfo.online"></div>

          </div>

        </label>


        <!-- DROPDOWN -->
        <div tabindex="0"
          class="dropdown-content mt-4 w-80 bg-gray-900 border border-gray-700 rounded-2xl shadow-2xl overflow-hidden animate-fadeIn z-[999]">

          <!-- HEADER USER -->
          <div class="p-5 bg-gradient-to-r from-blue-900/40 to-indigo-900/40 border-b border-gray-700">

            <div class="flex items-center gap-4">

              <!-- FOTO -->
              <div class="avatar">
                <div class="w-16 rounded-full border-2 border-blue-500">

                  <img [src]="userInfo.image" alt="Avatar" />

                </div>
              </div>

              <!-- INFO -->
              <div class="flex-1">

                <h2 class="font-bold text-white text-lg leading-5">
                  {{ userInfo.name }}
                </h2>

                <p class="text-sm text-gray-400 mt-1">
                  {{ userInfo.email }}
                </p>

                <div class="flex items-center gap-2 mt-2">

                  <div class="w-2 h-2 rounded-full" [class.bg-green-500]="userInfo.online"
                    [class.bg-gray-500]="!userInfo.online"></div>

                  <span class="text-xs text-gray-400">
                    {{ userInfo.online ? 'En línea' : 'Desconectado' }}
                  </span>

                  <span class="text-xs px-2 py-1 rounded-full bg-blue-900/40 text-blue-300 border border-blue-700 ml-2">
                    {{ userInfo.role }}
                  </span>

                </div>

              </div>

            </div>

          </div>


          <!-- OPCIONES -->
          <ul class="menu p-2">

            @for(option of menuUserOptions; track option.label){

            <li>

              <a [routerLink]="[option.route]" routerLinkActive="bg-blue-800 text-white"
                class="flex items-center gap-3 rounded-xl transition-all duration-200 hover:bg-gray-800"
                [class.text-red-400]="option.danger" [class.hover:bg-red-900]="option.danger"
                [class.hover:text-white]="option.danger" (click)="option.label === 'Cerrar sesión' ? logout() : null">

                <i [class]="option.icon" class="w-5 text-center"></i>

                <span class="font-medium">
                  {{ option.label }}
                </span>

              </a>

            </li>

            }

          </ul>

        </div>

      </div>
    </div>
  </div>
</div>
