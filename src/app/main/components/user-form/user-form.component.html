<div class="max-w-5xl mx-auto p-6">

    <!-- CARD -->
    <div class="bg-gray-900 border border-gray-800 rounded-3xl shadow-2xl overflow-hidden">

        <!-- HEADER -->
        <div class="p-6 border-b border-gray-800 bg-gradient-to-r from-blue-900/30 to-indigo-900/30">

            <h1 class="text-3xl font-bold text-white">
                @if(mode === 'register'){
                Registrarse
                }

                @if(mode === 'profile'){
                Mi perfil
                }

                @if(mode === 'edit'){
                Editar usuario
                }
            </h1>

            <p class="text-gray-400 mt-2">
                Completa la información para continuar
            </p>

        </div>


        <!-- BODY -->
        <div class="p-6 space-y-8">

            <!-- TIPO PERSONA -->
            <div>

                <label class="label">
                    <span class="label-text text-gray-300">
                        Tipo de persona
                    </span>
                </label>

                <select class="select select-bordered w-full bg-gray-800 border-gray-700 text-white"
                    [(ngModel)]="tipoPersona">
                    <option value="natural">Natural</option>
                    <option value="juridica">Jurídica</option>
                </select>

            </div>


            <!-- ===================================================== -->
            <!-- PERSONA NATURAL -->
            <!-- ===================================================== -->

            @if(tipoPersona === 'natural'){

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- TIPO DOCUMENTO -->
                <div>

                    <label class="label">
                        <span class="label-text text-gray-300">
                            Tipo de documento
                        </span>
                    </label>

                    <select class="select select-bordered w-full bg-gray-800 border-gray-700 text-white"
                        [(ngModel)]="natural.tipoDocumento">
                        <option value="">Seleccione</option>
                        <option value="CC">Cédula</option>
                        <option value="CE">Cédula extranjería</option>
                        <option value="TI">Tarjeta identidad</option>
                        <option value="PAS">Pasaporte</option>
                    </select>

                </div>


                <!-- IDENTIFICACIÓN -->
                <div>

                    <label class="label">
                        <span class="label-text text-gray-300">
                            Identificación
                        </span>
                    </label>

                    <input type="text" class="input input-bordered w-full bg-gray-800 border-gray-700 text-white"
                        [(ngModel)]="natural.identificacion" />

                </div>


                <!-- NOMBRES -->
                <div class="md:col-span-2">

                    <label class="label">
                        <span class="label-text text-gray-300">
                            Nombres y apellidos
                        </span>
                    </label>

                    <input type="text" class="input input-bordered w-full bg-gray-800 border-gray-700 text-white"
                        [(ngModel)]="natural.nombres" />

                </div>


                <!-- FECHA -->
                <div>

                    <label class="label">
                        <span class="label-text text-gray-300">
                            Fecha de nacimiento
                        </span>
                    </label>

                    <input type="date" class="input input-bordered w-full bg-gray-800 border-gray-700 text-white"
                        [(ngModel)]="natural.fechaNacimiento" />

                </div>


                <!-- MANEJA PERSONAL -->
                <div>

                    <label class="label">
                        <span class="label-text text-gray-300">
                            ¿Maneja personal?
                        </span>
                    </label>

                    <select class="select select-bordered w-full bg-gray-800 border-gray-700 text-white"
                        [(ngModel)]="natural.manejaPersonal">
                        <option value="SI">SI</option>
                        <option value="NO">NO</option>
                    </select>

                </div>


                <!-- VARIOS VEHÍCULOS -->
                <div>

                    <label class="label">
                        <span class="label-text text-gray-300">
                            ¿Cuenta con más de un vehículo?
                        </span>
                    </label>

                    <select class="select select-bordered w-full bg-gray-800 border-gray-700 text-white"
                        [(ngModel)]="natural.variosVehiculos">
                        <option value="SI">SI</option>
                        <option value="NO">NO</option>
                    </select>

                </div>


                <!-- FOTO -->
                <div>

                    <label class="label">
                        <span class="label-text text-gray-300">
                            Foto personal
                        </span>
                    </label>

                    <input type="file"
                        class="file-input file-input-bordered w-full bg-gray-800 border-gray-700 text-white"
                        (change)="onFileSelected($event, 'foto')" />

                </div>


                <!-- PREVIEW -->
                @if(natural.foto){

                <div class="md:col-span-2 flex justify-center">

                    <img [src]="natural.foto" class="w-40 h-40 rounded-2xl object-cover border border-gray-700" />

                </div>

                }

            </div>

            }


            <!-- ===================================================== -->
            <!-- PERSONA JURÍDICA -->
            <!-- ===================================================== -->

            @if(tipoPersona === 'juridica'){

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- NIT -->
                <div>

                    <label class="label">
                        <span class="label-text text-gray-300">
                            NIT
                        </span>
                    </label>

                    <input type="text" class="input input-bordered w-full bg-gray-800 border-gray-700 text-white"
                        [(ngModel)]="juridica.nit" />

                </div>


                <!-- DV -->
                <div>

                    <label class="label">
                        <span class="label-text text-gray-300">
                            Dígito de verificación
                        </span>
                    </label>

                    <input type="text" class="input input-bordered w-full bg-gray-800 border-gray-700 text-white"
                        [(ngModel)]="juridica.digitoVerificacion" />

                </div>


                <!-- RAZÓN SOCIAL -->
                <div class="md:col-span-2">

                    <label class="label">
                        <span class="label-text text-gray-300">
                            Razón social
                        </span>
                    </label>

                    <input type="text" class="input input-bordered w-full bg-gray-800 border-gray-700 text-white"
                        [(ngModel)]="juridica.razonSocial" />

                </div>


                <!-- LOGO -->
                <div>

                    <label class="label">
                        <span class="label-text text-gray-300">
                            Logo empresa
                        </span>
                    </label>

                    <input type="file"
                        class="file-input file-input-bordered w-full bg-gray-800 border-gray-700 text-white"
                        (change)="onFileSelected($event, 'logo')" />

                </div>


                <!-- PREVIEW -->
                @if(juridica.logo){

                <div class="md:col-span-2 flex justify-center">

                    <img [src]="juridica.logo"
                        class="w-40 h-40 rounded-2xl object-contain border border-gray-700 bg-white p-4" />

                </div>

                }

            </div>

            }


            <!-- BOTÓN -->
            <div class="flex justify-end">

                <button class="btn bg-blue-600 hover:bg-blue-700 border-none text-white px-8"
                    (click)="guardarFormulario()">
                    Guardar información
                </button>

            </div>

        </div>

    </div>

</div>
